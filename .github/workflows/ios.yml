name: iOS (TestFlight)

# Builds the iOS app and uploads it to App Store Connect, where it appears in
# TestFlight. Runs on its own from the Actions tab, or from release.yml once a
# desktop release has been published, so a failure here never holds up the
# desktop builds or the auto-updater. Re-run it on its own if it fails.
#
# Needs these repo secrets:
#   IOS_CERTIFICATE           base64 of the "Apple Distribution" .p12
#   IOS_CERTIFICATE_PASSWORD  password for that .p12
#   IOS_MOBILE_PROVISION      base64 of the App Store provisioning profile
#   APPSTORE_API_KEY_ID       App Store Connect API key id
#   APPSTORE_API_ISSUER_ID    App Store Connect API issuer id
#   APPSTORE_API_PRIVATE_KEY  contents of the API key's AuthKey_<id>.p8

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (tag, branch or SHA) to build
        required: false
        default: main
  workflow_call:
    inputs:
      ref:
        description: Git ref (tag, branch or SHA) to build
        type: string
        required: true

permissions:
  contents: read

jobs:
  testflight:
    name: Build + upload to TestFlight
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri installs IOS_MOBILE_PROVISION into ~/Library/MobileDevice, but
      # Xcode 16+ only looks in UserData, so put a copy there too, named by
      # its UUID (which is what Tauri writes into the project).
      - name: Install provisioning profile for Xcode 16+
        env:
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        run: |
          set -euo pipefail
          dir="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$dir"
          profile="$RUNNER_TEMP/profile.mobileprovision"
          printf '%s' "$IOS_MOBILE_PROVISION" | base64 --decode > "$profile"
          uuid=$(security cms -D -i "$profile" | plutil -extract UUID raw -)
          mv "$profile" "$dir/$uuid.mobileprovision"
          echo "Installed profile $uuid"

      # tauri ios build rewrites the signing keys in project.pbxproj, but its
      # export options are built from the values it read *before* rewriting,
      # so the export would ask for automatic signing (which needs an Apple
      # account). Switch the committed placeholders to manual signing here so
      # both steps agree. Local builds keep automatic signing.
      - name: Switch the Xcode project to manual signing
        run: |
          set -euo pipefail
          pbx=src-tauri/gen/apple/mz-stock-ticker.xcodeproj/project.pbxproj
          sed -i '' \
            -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/' \
            -e 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "iPhone Developer";/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution";/' \
            "$pbx"
          test "$(grep -c 'CODE_SIGN_STYLE = Manual;' "$pbx")" -eq 2
          test "$(grep -c '"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "Apple Distribution";' "$pbx")" -eq 2

      # Tauri reads IOS_CERTIFICATE / IOS_CERTIFICATE_PASSWORD /
      # IOS_MOBILE_PROVISION and signs manually with them. The run number
      # becomes the build number (CFBundleVersion 0.6.0.<n>), which
      # App Store Connect requires to be unique for each upload.
      - name: Build IPA
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        run: >
          npm run tauri ios build --
          --ci
          --export-method app-store-connect
          --build-number ${{ github.run_number }}

      - name: Signing diagnostics
        if: failure()
        run: |
          echo "::group::Provisioning profiles"
          ls -la "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles" || true
          echo "::endgroup::"
          echo "::group::Keychains and codesigning identities"
          security list-keychains -d user
          security find-identity -v -p codesigning
          echo "::endgroup::"
          echo "::group::Signing settings Tauri wrote"
          git diff -- src-tauri/gen/apple || true
          grep -nE "CODE_SIGN|PROVISIONING|DEVELOPMENT_TEAM" src-tauri/gen/apple/mz-stock-ticker.xcodeproj/project.pbxproj || true
          cat src-tauri/gen/apple/ExportOptions.plist || true
          echo "::endgroup::"

      - name: Upload to App Store Connect
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          ipa=$(find src-tauri/gen/apple/build -name '*.ipa' | head -n 1)
          if [ -z "$ipa" ]; then
            echo "::error::No .ipa produced by the build"
            exit 1
          fi
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$APPSTORE_API_PRIVATE_KEY" \
            > ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8
          xcrun altool --upload-app --type ios --file "$ipa" \
            --apiKey "$APPSTORE_API_KEY_ID" --apiIssuer "$APPSTORE_API_ISSUER_ID"

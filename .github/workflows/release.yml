name: Release

# Release flow (release-please):
#  1. Every push to main updates a "release PR" that bumps the version
#     (package.json, package-lock.json, tauri.conf.json, Cargo.toml) and
#     updates CHANGELOG.md based on conventional commit messages.
#  2. Merging that PR creates a DRAFT GitHub release.
#  3. Tests run; if they pass, all platforms build and upload their bundles
#     to the draft. Only then is the release published (which also creates
#     the git tag). If anything fails, the release stays an unpublished draft.
#
# NOTE: requires repo Settings -> Actions -> General -> Workflow permissions:
#   "Allow GitHub Actions to create and approve pull requests" to be enabled.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release-please:
    name: Version bump / release PR
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Optional PAT (fine-grained: Contents + Pull requests read/write).
          # Using a PAT instead of GITHUB_TOKEN also makes CI run on the
          # release PRs. Falls back to the default token if the secret is unset.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  test:
    name: Tests
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test

      # also produces ../dist, required by tauri::generate_context!
      - name: Typecheck + build frontend
        run: npm run build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

  build:
    name: Build (${{ matrix.platform }}${{ matrix.args && format(' {0}', matrix.args) || '' }})
    needs: [release-please, test]
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - platform: macos-latest # Intel (cross-compiled)
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          # 22.04 keeps the glibc requirement low so the Linux bundles run on
          # older distros; bump to ubuntu-latest if this runner is retired.
          - platform: ubuntu-22.04
            args: ''
            rust-targets: ''
          - platform: windows-latest
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build and upload to draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater artifact signing; tauri-action also uploads latest.json,
          # which the in-app updater fetches from the latest published release.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing + notarization (only used on the macOS runners)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          releaseId: ${{ needs.release-please.outputs.release_id }}
          args: ${{ matrix.args }}

      # tauri-action notarizes and staples the .app, but leaves the .dmg wrapper
      # signed-but-unnotarized — which makes Gatekeeper warn when a user opens the
      # downloaded disk image. Notarize + staple the DMG too, then replace the
      # asset tauri-action uploaded to the (still-draft) release.
      - name: Notarize and staple DMG
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_PASSWORD:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ]; then
            echo "Apple notarization credentials not set; skipping DMG notarization."
            exit 0
          fi
          shopt -s nullglob
          dmgs=(src-tauri/target/*/release/bundle/dmg/*.dmg)
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "No DMG found under src-tauri/target/*/release/bundle/dmg/; nothing to notarize."
            exit 0
          fi
          for dmg in "${dmgs[@]}"; do
            echo "::group::Notarizing $(basename "$dmg")"
            xcrun notarytool submit "$dmg" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
            gh release upload "$TAG" "$dmg" --clobber -R "${{ github.repository }}"
            echo "::endgroup::"
          done

  publish:
    name: Publish release
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Mark release as published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH \
            "repos/${{ github.repository }}/releases/${{ needs.release-please.outputs.release_id }}" \
            -F draft=false

      # keep Cargo.lock's version of mz-stock-ticker in sync with the bump
      # release-please made in Cargo.toml, so local builds don't dirty the tree
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: dtolnay/rust-toolchain@stable

      - name: Sync Cargo.lock with bumped version
        run: |
          cargo update --workspace --manifest-path src-tauri/Cargo.toml
          if ! git diff --quiet src-tauri/Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src-tauri/Cargo.lock
            git commit -m "chore: sync Cargo.lock for ${{ needs.release-please.outputs.tag_name }}"
            git pull --rebase origin main
            git push origin main
          fi
